name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
    
    - name: Debug SUB_URL Value
      run: |
        echo "========================================"
        echo "🔍 SUB_URL 原始值检查:"
        echo "========================================"
        echo "SUB_URL 长度: ${#SUB_URL}"
        echo "SUB_URL 前30字符: ${SUB_URL:0:30}"
        echo "SUB_URL 是否为空: $(test -z "$SUB_URL" && echo '是 ❌' || echo '否 ✅')"
        echo "========================================"
      env:
        SUB_URL: ${{ secrets.SUB_URL }}
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
    
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        SUB_URL: "${{ secrets.SUB_URL }}"
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      run: |
        echo "=== 环境变量检查 (运行脚本前) ==="
        echo "SUB_URL 长度: ${#SUB_URL}"
        echo "SUB_URL 前20字符: ${SUB_URL:0:20}..."
        echo "==================================="
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js
    
    - name: Commit Renew Dates
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add renew_dates.json || true
        git diff --cached --quiet renew_dates.json || git commit -m "chore: update renew dates [skip ci]"
        for i in {1..5}; do
          git pull --rebase --autostash || true
          if git push; then
            break
          fi
          echo "⚠️ Push failed, retrying in 5 seconds ($i/5)..."
          sleep 5
        done

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/
